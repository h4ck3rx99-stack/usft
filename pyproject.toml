[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasonic-airdrop"
version = "1.0.0"
description = "Transfer files between nearby computers using only sound (near-ultrasonic acoustic modem)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "sounddevice>=0.4.6,<0.6",
    "reedsolo>=1.7,<3",
    "cryptography>=42,<52",
    "PySide6>=6.6,<7",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-timeout>=2.2,<3",
    "ruff>=0.5,<1",
    "mypy>=1.10,<3",
]

[project.scripts]
airdrop = "ultrasonic_airdrop.cli:main"

[project.gui-scripts]
airdrop-gui = "ultrasonic_airdrop.gui.app:main"

[tool.setuptools.packages.find]
include = ["ultrasonic_airdrop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
markers = [
    "slow: long-running simulations (deselect with -m 'not slow')",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["ultrasonic_airdrop"]

[[tool.mypy.overrides]]
module = ["ultrasonic_airdrop.gui.*"]
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
warn_return_any = false
